      aproposH: '사이트 소개',
      whoH: '누가 만들었나요',
      whoWarning: '⚠️ <b>롤 초보자가 만들었습니다.</b> 저도 아직 배우는 중이라 이 사이트에는 오류나 근사치, 잘못된 결론이 있을 수 있습니다. 직접 확인해 보세요. 각 데이터의 출처가 바로 그러라고 있는 것입니다.',
      whoText: '이 게임을 처음 시작했을 때, 왜 그리고 어떻게라는 명확한 설명이 부족해 답답했습니다. 그래서 제가 잘하는 일, 즉 조사를 해보기로 했고 그 결과를 다른 초보자들과 나누기로 했습니다. 그렇게 만들어진 것이 LoL by Noob for Noobs입니다. 저는 롤에 대해 특별히 잘 안다고 주장하지 않습니다. 그저 게임을 이해하고 실력을 늘리는 데 도움이 된다고 생각하는 여러 출처의 자료를 모아 정리할 뿐입니다.',

        'lolalytics의 수치: 해당 사이트에서 가져왔으며, 위의 데이터 출처에 날짜와 함께 표기되어 있습니다.',
        '유튜브 영상에서 가져온 팁: 각 팁은 해당 영상과 타임스탬프를 표기하며, 영상의 저작권은 각 제작자에게 있습니다.',
      ],

    },
  };

  const LANGS = ['fr', 'en', 'ko'];
  let lang = 'fr';
  try{ const saved = localStorage.getItem('docLang'); if(LANGS.includes(saved)) lang = saved; }catch(e){}

  function vol(ko){ return ko >= 100 ? (ko / 1024).toFixed(1).replace('.', ',') + ' Mo' : ko + ' Ko'; }

  function apply(){
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[el.dataset.i18n]; });

    // Tableau des remerciements : mêmes sources que le pied de page (nav.js, AppNav.CREDITS), description dans la
    // langue choisie ; en coréen, nom du site en coréen quand le site en a un vrai (Namu Wiki : `label_ko`) ; un
    // drapeau (AppNav.FLAGS[c.lang]) indique la langue du contenu repris sur chaque site, plus rapide à lire qu'un
    // nom traduit.
    const whatKey = lang === 'fr' ? 'what' : 'what_' + lang;
    document.getElementById('creditsTable').innerHTML = AppNav.CREDITS.map(c =>
      `<tr><td>${AppNav.FLAGS[c.lang]} ${AppNav.creditLink(c, lang === 'ko' ? c.label_ko : null)}</td><td class="num">${vol(c.ko)}</td><td class="num">${c.refs.toLocaleString(lang === 'ko' ? 'ko-KR' : (lang === 'en' ? 'en-GB' : 'fr-FR'))}</td><td>${c[whatKey] || c.what}</td></tr>`).join('');

    // Liste « Contribuer »
    document.getElementById('contribList').innerHTML = t.contribItems.map(li => `<li>${li}</li>`).join('');

    // page d'où vient le visiteur (lien « Contribuer » du footer) : transmise au formulaire à la place de la section elle-même
    const fromQ = new URLSearchParams(location.search);
    const fromCtx = fromQ.get('depuis') ? { page: fromQ.get('depuisPage') || 'inconnue', url: fromQ.get('depuis') } : { page: 'contribuer' };
    document.getElementById('contribTally').innerHTML = AppNav.CONTRIBUTE.tally
      ? `${t.contribTallyPrefix}${AppNav.reportLink(fromCtx, t.contribTallyLabel)}${t.contribTallySuffix}`
      : `${t.contribIssuePrefix}${AppNav.reportLink(fromCtx, t.contribIssueLabel)}${t.contribIssueSuffix}`;
    document.getElementById('contribIssues').innerHTML = t.contribIssuesPara;

    // Liste « Licences » : l'entrée Tally seulement si le formulaire est configuré (nav.js, CONTRIBUTE.tally)
    const licItems = t.licItems.slice();
    if(AppNav.CONTRIBUTE.tally) licItems.push(t.licTally);
    document.getElementById('licList').innerHTML = licItems.map(li => `<li>${li}</li>`).join('');
  }

  document.querySelector('.lang-ctl').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if(!b) return;
    lang = b.dataset.lang;
    try{ localStorage.setItem('docLang', lang); }catch(e){}
    apply();
  });

  apply();

  // éléments réservés à l'édition privée (contenus absents de l'édition publique)
  if(window.isPublicEdition && window.isPublicEdition()) document.querySelectorAll('[data-edition="private"]').forEach(el => el.remove());
})();
</script>
